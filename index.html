<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarek Monwar Saniyat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--card:#1a202c;--field:#0f141c;--line:#252d3b;--ink:#e8ecf4;--mute:#8b95a9;--brand:#5588ff;--theirs:#242c3b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Roboto,'Hind Siliguri',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#2b78e8 0%,#5a55dc 55%,#7b44d6 100%) fixed}
button,input{font:inherit}
.hidden{display:none!important}

/* ---------- Auth ---------- */
#auth{min-height:100%;display:grid;place-items:center;padding:36px 20px}
.box{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:36px 36px 40px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.logo{text-align:center;font-size:64px;line-height:1;filter:drop-shadow(0 2px 0 #000)}
h1{text-align:center;font-size:30px;margin:10px 0 4px}
.sub{text-align:center;color:var(--mute);margin:0 0 26px;font-size:17px}
.tabs{display:flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:22px}
.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:500;font-size:17px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink)}
label{display:block;color:var(--mute);font-weight:500;margin:0 0 8px}
.f{margin-bottom:18px}
input{width:100%;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{width:100%;height:52px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{min-height:22px;font-size:14px;margin:4px 0 10px;color:#ff7b7b}
.msg.ok{color:#5fd39a}

/* ---------- Chat ---------- */
#app{height:100%;display:flex;max-width:980px;margin:0 auto;background:var(--card);box-shadow:0 0 60px rgba(0,0,0,.35)}
#side{width:290px;border-right:1px solid var(--line);display:flex;flex-direction:column}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font-size:17px}
header small{color:var(--mute);display:block}
.out{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 13px;color:var(--ink);cursor:pointer}
#list{overflow:auto;flex:1}
.conv{display:block;width:100%;text-align:left;padding:13px 18px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.conv.on{background:var(--field)}
.conv span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.new b::after{content:" •";color:var(--brand)}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:9px 14px;border-radius:16px;background:var(--theirs);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--brand);color:#fff;align-self:flex-end}
.m time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
form#send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
form#send input{height:48px}
form#send .btn{width:auto;height:48px;padding:0 22px;font-size:16px}
#back{display:none}
@media(max-width:700px){
  .box{padding:28px 22px 32px}
  #side{width:100%;border:0}
  #app.inchat #side{display:none}
  #app.owner:not(.inchat) #chat{display:none}
  #back{display:inline-block}
  .m{max-width:88%}
}
</style>
</head>
<body>

<section id="auth">
  <div class="box">
    <div class="logo">💬</div>
    <h1>Tarek Monwar Saniyat</h1>
    <p class="sub">Sign in to message me directly</p>

    <div class="tabs">
      <button id="tabIn" class="on" type="button">Sign in</button>
      <button id="tabUp" type="button">Create account</button>
    </div>

    <div class="f up hidden"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
    <div class="f up hidden"><label for="uname">Choose a username</label><input id="uname" autocomplete="username" autocapitalize="none" maxlength="20"></div>
    <div class="f in"><label for="login">Username or email</label><input id="login" autocomplete="username" autocapitalize="none"></div>
    <div class="f up hidden"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
    <div class="f up hidden"><label for="phone">Phone (optional)</label><input id="phone" type="tel" autocomplete="tel"></div>
    <div class="f"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <div class="f up hidden"><label for="pass2">Confirm password</label><input id="pass2" type="password" autocomplete="new-password"></div>

    <p class="msg" id="err"></p>
    <button class="btn" id="go">Sign in</button>
  </div>
</section>

<section id="app" class="hidden">
  <aside id="side" class="hidden">
    <header><div><b>Messages</b><small>Admin inbox</small></div><button class="out" id="out1">Log out</button></header>
    <div id="list"></div>
  </aside>
  <main id="chat">
    <header>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="out" id="back">←</button>
        <div><b id="title">Tarek Monwar Saniyat</b><small id="subt"></small></div>
      </div>
      <button class="out" id="out2">Log out</button>
    </header>
    <div id="msgs"></div>
    <form id="send">
      <input id="text" placeholder="Write a message…" maxlength="2000" autocomplete="off">
      <button class="btn" type="submit">Send</button>
    </form>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== শুধু এই দুটি বদলান (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
// =====================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let me = null, isOwner = false, current = null, channel = null, signup = false;
let profiles = {}, lastMsg = {}, unread = new Set();
const fmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', day: 'numeric', month: 'short' });

// ---------- Auth ----------
function setMode(up){
  signup = up;
  $('tabIn').classList.toggle('on', !up); $('tabUp').classList.toggle('on', up);
  document.querySelectorAll('.up').forEach(e => e.classList.toggle('hidden', !up));
  document.querySelectorAll('.in').forEach(e => e.classList.toggle('hidden', up));
  $('go').textContent = up ? 'Create account' : 'Sign in';
  $('pass').autocomplete = up ? 'new-password' : 'current-password';
  say('');
}
$('tabIn').onclick = () => setMode(false);
$('tabUp').onclick = () => setMode(true);
function say(t, ok){ $('err').textContent = t; $('err').className = 'msg' + (ok ? ' ok' : ''); }

$('go').onclick = async () => {
  say(''); $('go').disabled = true;
  try { signup ? await doSignup() : await doLogin(); }
  catch (e) { say(e.message || 'Something went wrong. Try again.'); }
  $('go').disabled = false;
};

async function doLogin(){
  let id = $('login').value.trim(), password = $('pass').value;
  if (!id || !password) throw new Error('Enter your username/email and password.');
  let email = id;
  if (!id.includes('@')) {
    const { data } = await db.rpc('email_for_username', { u: id });
    if (!data) throw new Error('No account found with that username.');
    email = data;
  }
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) throw new Error('Wrong username/email or password.');
}

async function doSignup(){
  const name = $('name').value.trim(), username = $('uname').value.trim().toLowerCase(),
        email = $('email').value.trim(), phone = $('phone').value.trim(),
        password = $('pass').value, pass2 = $('pass2').value;
  if (!name) throw new Error('Enter your full name.');
  if (!/^[a-z0-9_.]{3,20}$/.test(username)) throw new Error('Username: 3–20 letters, numbers, _ or .');
  if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Enter a valid email.');
  if (password.length < 6) throw new Error('Password must be at least 6 characters.');
  if (password !== pass2) throw new Error('Passwords do not match.');
  const { data: taken } = await db.rpc('email_for_username', { u: username });
  if (taken) throw new Error('That username is taken. Try another.');
  const { data, error } = await db.auth.signUp({ email, password, options: { data: { name, username, phone } } });
  if (error) throw new Error(error.message);
  if (!data.session) { setMode(false); say('Check your email and confirm your account, then sign in.', true); }
}

const logout = () => db.auth.signOut();
$('out1').onclick = $('out2').onclick = logout;
db.auth.onAuthStateChange((_e, s) => { s?.user ? start(s.user) : stop(); });

function stop(){
  me = null; current = null;
  if (channel) { db.removeChannel(channel); channel = null; }
  $('app').classList.add('hidden'); $('auth').classList.remove('hidden');
}

// ---------- App ----------
async function start(user){
  if (me?.id === user.id) return;
  me = user;
  const { data } = await db.rpc('is_owner');
  isOwner = data === true;
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('app').classList.toggle('owner', isOwner);
  $('side').classList.toggle('hidden', !isOwner);

  if (isOwner) {
    $('title').textContent = 'Pick a conversation'; $('subt').textContent = '';
    $('send').classList.add('hidden');
    await loadInbox();
  } else {
    $('back').classList.add('hidden');
    $('title').textContent = 'Tarek Monwar Saniyat'; $('subt').textContent = 'Direct message';
    openConv(me.id);
  }

  channel = db.channel('msgs').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
    const m = p.new;
    if (isOwner) {
      lastMsg[m.user_id] = m;
      if (m.user_id !== current && m.sender_id !== me.id) unread.add(m.user_id);
      profiles[m.user_id] ? renderList() : loadInbox();
    }
    if (m.user_id === current) addMsg(m);
  }).subscribe();
}

async function loadInbox(){
  const [{ data: ps }, { data: ms }] = await Promise.all([
    db.from('profiles').select('id,name,username,email,phone').neq('id', me.id),
    db.from('messages').select('*').order('created_at', { ascending: false }).limit(1000)
  ]);
  profiles = Object.fromEntries((ps || []).map(p => [p.id, p]));
  lastMsg = {};
  (ms || []).forEach(m => { if (!lastMsg[m.user_id]) lastMsg[m.user_id] = m; });
  renderList();
}

function renderList(){
  const ids = Object.keys(lastMsg).filter(id => profiles[id])
    .sort((a, b) => new Date(lastMsg[b].created_at) - new Date(lastMsg[a].created_at));
  const list = $('list'); list.textContent = '';
  if (!ids.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'No messages yet.'; list.append(d); return; }
  ids.forEach(id => {
    const p = profiles[id], b = document.createElement('button');
    b.className = 'conv' + (id === current ? ' on' : '') + (unread.has(id) ? ' new' : '');
    const n = document.createElement('b'); n.textContent = p.name;
    const s = document.createElement('span'); s.textContent = lastMsg[id].body;
    b.append(n, s); b.onclick = () => openConv(id);
    list.append(b);
  });
}

async function openConv(uid){
  current = uid; unread.delete(uid);
  $('app').classList.add('inchat');
  if (isOwner) {
    const p = profiles[uid] || {};
    $('title').textContent = p.name || 'User';
    $('subt').textContent = ['@' + (p.username || ''), p.email, p.phone].filter(Boolean).join(' · ');
    $('send').classList.remove('hidden'); $('back').classList.remove('hidden');
    renderList();
  }
  const box = $('msgs'); box.textContent = '';
  const { data } = await db.from('messages').select('*').eq('user_id', uid).order('created_at').limit(500);
  if (!data?.length) {
    const d = document.createElement('div'); d.className = 'empty'; d.id = 'emptyNote';
    d.textContent = isOwner ? 'No messages yet.' : 'Write your first message below. I will reply here.';
    box.append(d);
  }
  (data || []).forEach(addMsg);
}
$('back').onclick = () => {
  current = null; $('app').classList.remove('inchat');
  $('title').textContent = 'Pick a conversation'; $('subt').textContent = '';
  $('send').classList.add('hidden'); renderList();
};

function addMsg(m){
  document.getElementById('emptyNote')?.remove();
  const box = $('msgs');
  if (box.querySelector(`[data-id="${m.id}"]`)) return;
  const d = document.createElement('div');
  d.dataset.id = m.id;
  d.className = 'm' + (m.sender_id === me.id ? ' me' : '');
  d.textContent = m.body;
  const t = document.createElement('time'); t.textContent = fmt.format(new Date(m.created_at));
  d.append(t); box.append(d);
  box.scrollTop = box.scrollHeight;
}

$('send').onsubmit = async e => {
  e.preventDefault();
  const body = $('text').value.trim();
  if (!body || !current) return;
  $('text').value = '';
  const { error } = await db.from('messages').insert({ user_id: current, sender_id: me.id, body });
  if (error) { $('text').value = body; alert('Could not send: ' + error.message); }
};

setMode(false);
</script>
</body>
</html>
